[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-lab"
version = "0.4.0"
description = "Amateur radio engineering toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy>=1.26,<3", "plotly>=5.20,<7", "streamlit>=1.35,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
